[project]
name = "ureport"
version = "1.7.6"
description = "U-Report dashboard built on data collected by RapidPro"
authors = [
    {"name" = "Nyaruka", "email" = "code@nyaruka.com"}
]
readme = "README.md"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "django>=6.1.1,<6.2",
    "smartmin>=6.2.3,<6.3.0",
    "rapidpro-dash>=1.23.1,<2.0.0",
    "colorama~=0.4.3",
    "celery[redis]>=5.5.3,<6.0.0",
    "django-compressor~=4.0",
    "django-debug-toolbar~=4.4.6",
    "django-digest~=1.13",
    "django-rosetta~=0.10.1",
    "django-storages~=1.14.4",
    "djangorestframework~=3.18.0",
    "dj-database-url~=2.3.0",
    "Pillow~=12.3.0",
    "gunicorn~=23.0.0",
    "sentry-sdk~=2.19.2",
    "psycopg~=3.2.3",
    "xlutils~=2.0.0",
    "mock~=5.1.0",
    "pycountry>=24.5.1",
    "django-countries~=7.6.1",
    "regex~=2026.4.4",
    "rapidpro-python>=2.22.1,<3.0.0",
    "feedparser~=6.0.2",
    "Markdown~=3.7",
    "iso8601~=0.1.12",
    "sorl-thumbnail~=12.11.0",
    "stop_words~=2018.7.23",
    "boto3>=1.27.1",
    "drf-yasg~=1.21.8",
    "django-valkey>=0.2.1,<0.3.0",
    "celery-redbeat>=2.4.2,<3.0.0",
    "whitenoise[brotli]~=6.12.0",
    "django-http-compression[brotli]~=1.4.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.2.2,<8.0.0",
    "ruff>=0.15.9,<0.16.0",
    "djangofmt>=1.0.0,<2.0.0",
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E501", "F405"]
fix = true
exclude = ["./.tox/*", "./.venv/*", "./env/*", "*/migrations/*", "./build/*"]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]
known-first-party = ["dash", "smartmin"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.djangofmt]
indent-width = 2
line-length = 200
custom-blocks = ["thumbnail", "compress"]
# opens and closes its wrapper divs in different loop iterations, which the parser rejects
extend-exclude = ["templates/polls/poll_questions.html"]

[tool.coverage.run]
source = ["ureport"]

[tool.coverage.report]
omit = ["*/migrations/*", "*/tests*", "*__init__*", "*settings*", "*management/commands*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
