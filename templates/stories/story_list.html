{% extends "smartmin/list.html" %}
{% load i18n %}

{% block content-title %}
  <h2 class="text-[2.5rem]! font-bold!">
    <img src="{{ STATIC_URL }}img/icons/stories_icon.png" alt="">
    <div class="inline-block! content-title-text">{% trans "Stories" %}</div>
  </h2>
{% endblock content-title %}
{% block table-buttons %}
  {% if view.add_button %}
    <a href="./create/" class="{% if is_rtl_org %}float-left!{% else %}float-right!{% endif %} button is-primary">{% trans "+ New Story" %}</a>
  {% endif %}
{% endblock table-buttons %}
